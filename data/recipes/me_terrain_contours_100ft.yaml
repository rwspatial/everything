name: me_terrain_contours_100ft
title: Contour lines, 100 ft (Maine)
description: 100-foot contour lines (30.48 m) traced from the 30 m Maine DEM with gdal_contour.
agency: Derived from USGS 3DEP
kind: vector
group: maine
vintage: { label: "3DEP 1 arc-second, current" }
coverage: { extent: Maine }
requires_keys: []
source:
  derive:
    from: maine/dem_30m
    contour: { interval: 30.48, attribute: elev_m }
target: src_terrain.contours_100ft
srs: EPSG:4326
depends_on: [me_terrain_dem_30m]
freshness: { method: none }
license: Public domain (derived from USGS 3DEP)
attribution: U.S. Geological Survey, 3D Elevation Program (contours)
enabled: true
