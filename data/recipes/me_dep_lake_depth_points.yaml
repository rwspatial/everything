name: me_dep_lake_depth_points
title: Lake depth soundings (DEP)
description: Depth points from lake bathymetry surveys (about 148,000 soundings).
agency: Maine Department of Environmental Protection
source:
  arcgis:
    url: https://gis.maine.gov/mapservices/rest/services/dep/MaineDEP_Lakes_Data/MapServer/2
    page_size: 5000
    params:
      geometryPrecision: 6
upstream:
  arcgis: https://gis.maine.gov/mapservices/rest/services/dep/MaineDEP_Lakes_Data/MapServer/2
target: src_dep.lake_depth_points
srs: EPSG:4326
fix_invalid: true
freshness:
  method: arcgis_item
  every: 30d
license: Public data; see the publisher's terms
attribution: Maine DEP
group: maine
coverage:
  extent: Maine
requires_keys: []
enabled: true
