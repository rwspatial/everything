name: me_acs5_2024_tract
title: Population, income, home value, age and poverty by tract (ACS 2020-2024)
description: American Community Survey 5-year estimates for Maine census tracts, from the Census Data API. Suppressed estimates load as NULL.
agency: U.S. Census Bureau (American Community Survey)
kind: table
group: maine
vintage: { label: "ACS 2020-2024 5-year", year: 2024 }
coverage: { extent: Maine }
requires_keys: [CENSUS_API_KEY]
source:
  census_api:
    dataset: 2024/acs/acs5
    get:
      NAME: name
      B01003_001E: pop
      B19013_001E: median_hh_income
      B19013_001M: median_hh_income_moe
      B25077_001E: median_home_value
      B01002_001E: median_age
      B17001_001E: poverty_universe
      B17001_002E: poverty_count
    for: "tract:*"
    in: ["state:23", "county:*"]
    geoid: [state, county, tract]
target: src_census.acs5_2024_tract
freshness: { method: none }
license: Public domain (U.S. Census Bureau)
attribution: "U.S. Census Bureau, American Community Survey 2020-2024 5-year estimates (B01003, B19013, B25077, B01002, B17001)"
enabled: true
