name: me_usgs_latest_flow
title: Latest streamflow at real-time gauges (USGS, Maine)
description: 'A snapshot of the latest real-time discharge reading (parameter 00060, ft3/s) at every active USGS gauge in
  and around Maine. Active = reporting continuously. Readings are as of the import: re-run with --redownload to refresh.'
agency: U.S. Geological Survey (Water Mission Area)
source:
