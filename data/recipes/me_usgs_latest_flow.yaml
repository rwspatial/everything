  filename: usgs_me_latest_flow.geojson
upstream:
  url: https://api.waterdata.usgs.gov/ogcapi/v0/collections/latest-continuous/items
target: src_hydro.usgs_latest_flow
srs: EPSG:4326
freshness:
  method: none
license: Public domain (USGS)
attribution: U.S. Geological Survey, Water Data for the Nation (provisional real-time data)
group: maine
coverage:
  extent: Maine
requires_keys: []
enabled: true
