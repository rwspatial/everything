name: me_terrain_dem_30m
title: Elevation (USGS 3DEP 1 arc-second, Maine, 30 m)
description: Bare-earth elevation in metres from the USGS 3D Elevation Program 1 arc-second seamless DEM, mosaicked from the 1x1 degree tiles over HTTP, clipped to Maine's town boundaries and reprojected to UTM 19N at 30 m.
agency: U.S. Geological Survey (3D Elevation Program)
kind: raster
group: maine
vintage: { label: "3DEP 1 arc-second, current" }
coverage: { extent: Maine }
requires_keys: []
source:
  tiles:
    template: https://prd-tnm.s3.amazonaws.com/StagedProducts/Elevation/1/TIFF/current/{tile}/USGS_1_{tile}.tif
    north: [43, 48]
    west: [67, 72]
target: cog:maine/dem_30m
srs: EPSG:26919
resolution: 30
resampling: bilinear
nodata: -9999
cutline_sql: "SELECT ST_Union(geom) AS geom FROM src_census.cousub"
cog_options: [PREDICTOR=YES]
depends_on: [me_cousub]
freshness: { method: none }
retention: { keep_versions: 1 }
license: Public domain (U.S. Geological Survey)
attribution: U.S. Geological Survey, 3D Elevation Program
enabled: true
