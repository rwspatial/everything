# Spatial app stack: Phase 1 (PostGIS + tiPG + proxy + geotools).
# Operate it through the Makefile (`make help`). See docs/setup/.
name: spatial

services:
  postgis:
    image: postgis/postgis:${POSTGIS_TAG:?set in .env}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  # One-shot: applies db/migrations with dbmate, then sets role passwords.
  # Also runs seed SQL on demand (`make seed`).
  migrator:
    image: ghcr.io/amacneil/dbmate:${DBMATE_TAG:?set in .env}
    entrypoint: ["/bin/sh", "/migrator/entrypoint.sh"]
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgis:5432/${POSTGRES_DB}?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
      TIPG_DB_PASSWORD: ${TIPG_DB_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      LOADER_DB_PASSWORD: ${LOADER_DB_PASSWORD}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD}
      ANALYST_DB_PASSWORD: ${ANALYST_DB_PASSWORD}
      ADMIN_API_DB_PASSWORD: ${ADMIN_API_DB_PASSWORD:?run make admin-credentials}
      MCP_DB_PASSWORD: ${MCP_DB_PASSWORD:-}   # empty: mcp_ro cannot log in (make mcp-credentials)
    volumes:
      - ./db:/db:ro
      - ./services/migrator:/migrator:ro
      - ./projects:/projects:ro     # projects/<slug>/sql/*.sql (make seed, mapgen apply)
    networks: [data]
    depends_on:
      postgis:
        condition: service_healthy
    restart: "no"

  tipg:
    image: ghcr.io/developmentseed/tipg:${TIPG_TAG:?set in .env}
    environment:
      DATABASE_URL: postgresql://tipg_ro:${TIPG_DB_PASSWORD}@postgis:5432/${POSTGRES_DB}
      PORT: "8000"
      WEB_CONCURRENCY: "2"
      TIPG_NAME: "Spatial tiles"
      TIPG_ROOT_PATH: /tiles
      TIPG_DB_SCHEMAS: '["pub"]'
      TIPG_CATALOG_TTL: ${TIPG_CATALOG_TTL:-300}
      # FALSE on purpose: with TRUE, tiPG 1.6.1 names tile layers by table name but its
      # style.json/tilejson say "pub.<table>", which breaks its own viewer. With FALSE both
      # say "default" (ADR 0002). One collection per tile, so the name is unambiguous.
      TIPG_SET_MVT_LAYERNAME: "FALSE"
      TIPG_DEFAULT_FEATURES_LIMIT: "1000"
      TIPG_MAX_FEATURES_PER_QUERY: "10000"
      TIPG_CORS_ORIGIN: http://localhost:${HTTP_PORT:-8080}
    networks: [api, data]
    depends_on:
      postgis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  proxy:
    image: caddy:${CADDY_TAG:?set in .env}
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      # Directory (not single-file) mount: editors replace files atomically, and Docker Desktop on WSL
      # loses single-file bind mounts when that happens.
      - ./services/proxy:/etc/caddy:ro
      - ./projects:/srv/projects:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, api]
    depends_on:
      tipg:
        condition: service_healthy
      frontend:
        condition: service_healthy
      core-api:
        condition: service_healthy
      titiler:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:80/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # Admin API (dashboard backend): read-only over the dataset registry in Phase A.
  # Never holds external API keys; never touches files. Reached only through the proxy.
  core-api:
    build:
      context: ./services/core-api
      additional_contexts:
        contracts: ./contracts        # manifest schema + validate.py, shared with mapgen
    image: spatial/core-api:local
    environment:
      DATABASE_URL: postgresql://admin_api:${ADMIN_API_DB_PASSWORD}@postgis:5432/${POSTGRES_DB}
      PROJECTS_DATABASE_URL: postgresql://app_rw:${APP_DB_PASSWORD}@postgis:5432/${POSTGRES_DB}
      MCP_PIPELINE_TOKEN: ${MCP_PIPELINE_TOKEN:-}   # project-pipeline MCP server: validate + field stats only
      MCP_ANALYSIS_TOKEN: ${MCP_ANALYSIS_TOKEN:-}   # analysis MCP server: processes + jobs (no promote)
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?run make admin-credentials}
    networks: [api, data]
    depends_on:
      postgis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/internal/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  # Raster tiles from Cloud Optimized GeoTIFFs in data/cog/ (read-only). Only reachable through the
  # proxy's named-raster route (/raster/<name>/...), which pins the file path: clients cannot pass their own URL.
  titiler:
    image: ghcr.io/developmentseed/titiler:${TITILER_TAG:-2.4.0}
    environment:
      PORT: "8000"
      WEB_CONCURRENCY: "2"
      GDAL_CACHEMAX: "512"
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
      GDAL_HTTP_MERGE_CONSECUTIVE_RANGES: "YES"
      CPL_VSIL_CURL_ALLOWED_EXTENSIONS: ".tif,.tiff"
      VSI_CACHE: "TRUE"
    volumes:
      - ./data/cog:/data/cog:ro
    networks: [api]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  # Svelte + MapLibre app: static build served by its own Caddy (frontend/Dockerfile).
  frontend:
    build:
      context: ./frontend
      args:
        NODE_TAG: ${NODE_TAG:-24.21.0-bookworm-slim}
        CADDY_TAG: ${CADDY_TAG}
    image: spatial/frontend:local
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # On-demand Node toolbox for frontend work: `make frontend-dev`, `make frontend-check`.
  node:
    profiles: [tools]
    image: node:${NODE_TAG:-24.21.0-bookworm-slim}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      HOME: /tmp/home
      BACKEND_URL: http://proxy
    volumes:
      - ./frontend:/app
      - ./contracts:/contracts:ro   # schema -> src/lib/contracts.gen.ts (make contracts)
      - ./projects:/projects:ro     # MapLibre style validation (make validate)
    working_dir: /app
    ports:
      - "127.0.0.1:5173:5173"   # only published with `run --service-ports` (make frontend-dev)
    networks: [edge]

  # MCP server: read-only database exploration for Claude Code (plan Phase 4; docs/setup/08-mcp.md).
  # Started per session over stdio by .mcp.json (`docker compose run --rm -T mcp-db`); no ports, internal network only.
  mcp-db:
    profiles: [mcp]
    build: ./mcp
    image: spatial/mcp:local
    command: ["python", "-m", "spatial_mcp.spatial_db"]
    environment:
      MCP_SERVER_NAME: spatial-db
      MCP_DATABASE_URL: postgresql://mcp_ro:${MCP_DB_PASSWORD:-}@postgis:5432/${POSTGRES_DB}
    networks: [data]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # MCP server: build map projects (validate, propose views as files, write manifests). No database credential,
  # no Docker socket: it reaches core-api (scoped token) and tipg on the internal api network, and can write
  # only projects/. Publishing stays `./mapgen apply <slug>`, run by a person (docs/setup/08-mcp.md).
  mcp-pipeline:
    profiles: [mcp]
    build: ./mcp
    image: spatial/mcp:local
    command: ["python", "-m", "spatial_mcp.project_pipeline"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      MCP_SERVER_NAME: project-pipeline
      CORE_API_URL: http://core-api:8000
      TIPG_URL: http://tipg:8000
      PUBLIC_URL: http://localhost:${HTTP_PORT:-8080}
      MCP_PIPELINE_TOKEN: ${MCP_PIPELINE_TOKEN:-}
      PROJECTS_DIR: /projects
    volumes:
      - ./projects:/projects
    networks: [api]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Analysis worker (plan Phase 5; docs/setup/09-ml-workers.md): claims kind=process jobs from app.jobs, runs R and
  # Python processes, publishes their output as pub.analysis_sandbox__job_<id>. Built FROM geotools (make workers-up).
  # Scale out: docker compose --profile workers up -d --scale worker=2
  worker:
    profiles: [workers]
    build:
      context: ./workers
      args:
        ROCKER_TAG: ${ROCKER_TAG:?set in .env}
      additional_contexts:
        contracts: ./contracts
    image: spatial/worker:local
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      WORKER_DATABASE_URL: postgresql://worker_rw:${WORKER_DB_PASSWORD}@postgis:5432/${POSTGRES_DB}
      PGHOST: postgis
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: worker_rw
      PGPASSWORD: ${WORKER_DB_PASSWORD}
      TIPG_URL: http://tipg:8000
      TIPG_CATALOG_TTL: ${TIPG_CATALOG_TTL:-300}   # same value tipg uses (compose.dev.yaml: 30)
      TIPG_WAIT_SECONDS: ${TIPG_WAIT_SECONDS:-360}
    networks: [data, api]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, time, sys; sys.exit(time.time() - os.path.getmtime('/tmp/worker-alive') > 90)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    restart: unless-stopped

  # MCP server: run R/Python analysis jobs through core-api (scoped token). No database credential, no files.
  mcp-analysis:
    profiles: [mcp]
    build: ./mcp
    image: spatial/mcp:local
    command: ["python", "-m", "spatial_mcp.analysis"]
    environment:
      MCP_SERVER_NAME: analysis
      CORE_API_URL: http://core-api:8000
      PUBLIC_URL: http://localhost:${HTTP_PORT:-8080}
      MCP_ANALYSIS_TOKEN: ${MCP_ANALYSIS_TOKEN:-}
    networks: [api]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Browser tests (Playwright + axe) against the running stack: `make e2e`.
  e2e:
    profiles: [test]
    image: mcr.microsoft.com/playwright:${PLAYWRIGHT_TAG:-v1.63.0-noble}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ipc: host
    environment:
      HOME: /tmp/home
      BASE_URL: http://proxy
      CI: "1"
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - ./frontend:/app
    working_dir: /app
    command: ["npx", "playwright", "test"]
    networks: [edge]

  # On-demand toolbox: GDAL CLI + R + Python 3, all on one GDAL/PROJ build.
  # Never started by `docker compose up`; used via `make import`, `make r`, `make py` ...
  geotools:
    profiles: [tools]
    build:
      context: ./services/geotools
      args:
        ROCKER_TAG: ${ROCKER_TAG:?set in .env}
    image: spatial/geotools:${ROCKER_TAG}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      HOME: /tmp/home
      PGHOST: postgis
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      LOADER_DB_PASSWORD: ${LOADER_DB_PASSWORD}
      ANALYST_DB_PASSWORD: ${ANALYST_DB_PASSWORD}
      TIPG_DB_PASSWORD: ${TIPG_DB_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}   # service=app: mapgen registers projects as app_rw
      TRIGGERED_BY: cli:${HOST_USER:-unknown}
      # External API keys: only here (and the Phase B worker). Never in core-api, frontend, proxy or tipg.
      CENSUS_API_KEY: ${CENSUS_API_KEY:-}
    volumes:
      - ./:/work
      - ./data/incoming:/data:ro
    working_dir: /work
    networks: [data, egress, api]   # api: health checks reach tipg/titiler
    depends_on:
      postgis:
        condition: service_healthy

networks:
  edge: {}                # proxy (host-published) <-> frontend; also node/e2e tools
  api:
    internal: true        # proxy <-> tipg / core-api / titiler
  data:
    internal: true        # anything that talks to PostGIS; no internet
  egress: {}              # outbound internet for geotools (dataset downloads)

volumes:
  pgdata:
  caddy_data:
  caddy_config:
